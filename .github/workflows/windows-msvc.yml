name: Windows MSVC build and tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DAXF_BUILD_TESTS=ON -DAXF_BUILD_APP=ON -DAXF_WERROR=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Install SDK
        run: cmake --install build --config ${{ matrix.config }} --prefix install

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiox-windows-${{ matrix.config }}
          path: |
            build/AudioX/${{ matrix.config }}/audiox.exe
            build/Tests/${{ matrix.config }}/*.exe
          if-no-files-found: warn

# This workflow compiles and runs CPU-only tests on Windows. It does NOT prove
# WASAPI or ASIO hardware behaviour; those tests require a physical machine.
