name: Windows MSVC build and tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        # Ninja avoids pinning a Visual Studio generator version; the runner
        # image may ship VS 2022 or newer while MSVC remains the compiler.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DAXF_BUILD_TESTS=ON -DAXF_BUILD_APP=ON -DAXF_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install SDK
        run: cmake --install build --prefix install

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiox-windows-msvc-${{ matrix.config }}
          path: |
            build/AudioX/audiox.exe
            build/Tests/*.exe
          if-no-files-found: warn

# This workflow compiles and runs CPU-only tests with MSVC. It does NOT prove
# WASAPI or ASIO hardware behaviour; those tests require a physical machine.
